{% extends 'attendance/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-modern p-4">
      <h4>Employee Login</h4>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <input name="emp_code" class="form-control" placeholder="Employee Code (e.g. E001)" required>
        </div>
        <div class="mb-3">
          <input name="pin" type="password" class="form-control" placeholder="PIN" required>
        </div>
        <button class="btn btn-primary">Login</button>
      </form>
      <div class="mt-2 small text-muted">Enter your employee code and PIN to continue.</div>
    </div>
  </div>
</div>
{% endblock %}
