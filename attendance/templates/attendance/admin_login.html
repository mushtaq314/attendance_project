{% extends 'attendance/base.html' %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card card-modern p-4">
      <h4>Admin Login</h4>
      {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <input name="password" type="password" class="form-control" placeholder="Admin password">
        </div>
        <button class="btn btn-primary">Login</button>
      </form>
      <div class="mt-3 small text-muted">Default demo password: <code>admin123</code> (change in settings/views)</div>
    </div>
  </div>
</div>
{% endblock %}
