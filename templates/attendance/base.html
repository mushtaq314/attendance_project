<!-- base.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Attendance{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* small custom styling for professional look */
    .card-modern { border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
    .btn-pill { border-radius: 999px; padding: 10px 20px; }
    .topbar { background: linear-gradient(90deg,#0d6efd,#6610f2); color: white; padding: 12px 18px; border-radius: 12px; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4">Attendance System</h1>
      <div>
        <!--<a class="btn btn-outline-secondary btn-sm" href="{% url 'attendance:employee_view' %}">Employee View</a>-->
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'attendance:employee_dashboard' %}">Home</a>
        <a class="btn btn-outline-secondary btn-sm" href="{% url 'attendance:admin_login' %}">Admin</a>
      </div>
    </div>
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
